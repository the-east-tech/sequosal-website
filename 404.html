<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#f5faf8">
  <title>Page not found | Sequosal</title>
  <style>
    *{box-sizing:border-box}
    body{margin:0;min-height:100vh;display:grid;place-items:center;padding:28px;font:16px/1.65 ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;background:#f5faf8;color:#18312d}
    main{width:min(100%,620px);padding:clamp(28px,6vw,54px);border:1px solid #dce9e4;border-radius:22px;background:#fff;box-shadow:0 20px 55px rgba(26,81,65,.06)}
    p{color:#536964;font-size:18px}
    .code{color:#137b68;font-size:12px;font-weight:800;letter-spacing:.16em;text-transform:uppercase}
    h1{margin:10px 0 12px;font-size:clamp(36px,7vw,58px);line-height:1.05;letter-spacing:-.055em}
    a{color:#137b68;font-weight:700;text-underline-offset:3px}
  </style>
</head>
<body>
  <main>
    <div class="code">404</div>
    <h1>Page not found.</h1>
    <p>The page may have moved or the address may be incorrect.</p>
    <a href="/">Return to Sequosal</a>
  </main>
</body>
</html>
